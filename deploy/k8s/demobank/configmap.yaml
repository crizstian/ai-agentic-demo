apiVersion: v1
kind: ConfigMap
metadata:
  name: harnessbank-demo-end2end-config
  namespace: harnessbank-demo-end2end
  labels:
    app: harnessbank-demo-end2end
data:
  APP_NAME: "DemoBank AI SDLC"
  LOG_LEVEL: "info"
  OPENAI_MODEL: "gpt-4"
  MCP_SERVER_URL: "http://mcp-financial-data:5001"
  # Required by deployment.yaml configMapKeyRef for the OpenAI client
  OPENAI_API_KEY: "sk-placeholder-for-demo"
  OPENAI_BASE_URL: "http://mock-openai:5002/v1"
  AI_CHAT_ENABLED: "true"
