# Harness values file — expressions resolved at deploy time
# <+artifact.image> resolves to the full image:tag from the pipeline artifact source
# <+pipeline.executionId> changes on every run so Kubernetes rolls the pod

name: harnessbank-demo
namespace: harnessbank-demo
image: <+artifact.image>
rolloutId: <+pipeline.executionId>
replicas: 1

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

containerPort: 3000

# Toggle readiness probe bug for Manifest Remediator demo
# Set to "/healthz" to enable the bug (triggers deploy failure + Manifest Remediator)
# Set to "/health" for normal operation (default for AI Security demo flow)
healthCheckPath: "/health"
