apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demobank-ingress
  namespace: harnessbank-demo
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: demobank.selatam.harness-demo.site
      http:
        paths:
          # Public APIs — routed through Apigee gateway (N-S traffic)
          - path: /api/accounts
            pathType: Prefix
            backend:
              service:
                name: harnessbank-demo
                port:
                  number: 80
          - path: /api/ai
            pathType: Prefix
            backend:
              service:
                name: harnessbank-demo
                port:
                  number: 80
          - path: /api/admin
            pathType: Prefix
            backend:
              service:
                name: harnessbank-demo
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: harnessbank-demo
                port:
                  number: 80
