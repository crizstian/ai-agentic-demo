apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demobank-ingress
  namespace: harnessbank-demo-end2end
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-set-headers: "nginx/custom-headers"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Original-Forwarded-For $http_x_forwarded_for;
spec:
  rules:
    - host: demobank-e2e.selatam.harness-demo.site
      http:
        paths:
          # Public APIs — routed through Apigee gateway (N-S traffic)
          - path: /api/accounts
            pathType: Prefix
            backend:
              service:
                name: harnessbank-demo-end2end
                port:
                  number: 80
          - path: /api/ai
            pathType: Prefix
            backend:
              service:
                name: harnessbank-demo-end2end
                port:
                  number: 80
          - path: /api/admin
            pathType: Prefix
            backend:
              service:
                name: harnessbank-demo-end2end
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: harnessbank-demo-end2end
                port:
                  number: 80
