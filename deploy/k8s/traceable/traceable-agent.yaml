# Traceable Platform Agent (TPA) — Runtime Protection
#
# DEPLOYMENT: via Harness CD pipeline, NOT raw kubectl apply.
#
# Harness Service Definitions (NativeHelm):
#   ┌────────────────────────┬──────────────────────────┬──────────────────────────┐
#   │ Service                │ Helm Chart               │ Namespace                │
#   ├────────────────────────┼──────────────────────────┼──────────────────────────┤
#   │ traceable_agent        │ traceable-agent v1.71.2  │ harnessbank-demo-end2end │
#   │ traceable_ebpf_tracer  │ traceable-ebpf-tracer    │ harnessbank-demo-end2end │
#   │ traceable_ast_runner   │ traceable-runner v2.7.0  │ harnessbank-demo-end2end │
#   └────────────────────────┴──────────────────────────┴──────────────────────────┘
#
# Pipeline: CDSimpleKubernetesDeployment
#   Variable: deploymentType = NativeHelm
#   Helm repo connector: traceableai_helm_repo (https://helm.traceable.ai)
#   Infrastructure: latam_nodepool_helm (KubernetesDirect, connector selatam)
#
# Architecture:
#   ┌────────────────────────────────────────────────────────────────────────┐
#   │  Namespace: harnessbank-demo-end2end                                  │
#   │                                                                       │
#   │  ┌──────────────────────────────────────────────────────────────────┐ │
#   │  │ TPA: traceable-agent (Deployment, v1.71.2)                      │ │
#   │  │                                                                  │ │
#   │  │ Funciones:                                                       │ │
#   │  │   - Recibe spans de TME (zipkin :5442) y eBPF tracer            │ │
#   │  │   - Forwards a Traceable Platform (api.us9.traceable.ai)        │ │
#   │  │   - Recibe blocking policies del platform (poll 30s)            │ │
#   │  │   - Distribuye policies a TME sidecars via gRPC                 │ │
#   │  │   - MutatingWebhook: inyecta TME sidecar en pods de namespaces  │ │
#   │  │     con label traceableai-inject-tme=enabled                    │ │
#   │  │                                                                  │ │
#   │  │ Auth: token-secret (TA_REFRESH_TOKEN)                           │ │
#   │  │ Templates: tme-template-override ConfigMap (endpoint + token)   │ │
#   │  └──────────────────────────────────────────────────────────────────┘ │
#   │                                                                       │
#   │  ┌──────────────────────────────────────────────────────────────────┐ │
#   │  │ eBPF Tracer (DaemonSet, 7 pods, v1.31.0)                       │ │
#   │  │ Captura pasiva E-W a nivel kernel — NO blocking                 │ │
#   │  │ Envia spans al TPA para API Discovery + deteccion              │ │
#   │  └──────────────────────────────────────────────────────────────────┘ │
#   │                                                                       │
#   │  ┌──────────────────────────────────────────────────────────────────┐ │
#   │  │ AST Runner (Deployment, traceable-runner v2.7.0)                │ │
#   │  │ API Security Testing — scans activos de APIs descubiertas       │ │
#   │  └──────────────────────────────────────────────────────────────────┘ │
#   └────────────────────────────────────────────────────────────────────────┘
#
#   ┌────────────────────────────────────────────────────────────────────────┐
#   │  Namespace: nginx  (label: traceableai-inject-tme=enabled)            │
#   │                                                                       │
#   │  Deployment: ingress-nginx-controller                                 │
#   │  ┌──────────────────────────────────────────────────────────────────┐ │
#   │  │ Pod (2/2 containers + 1 init)                                   │ │
#   │  │                                                                  │ │
#   │  │ InitContainer: traceable-nginx-init                              │ │
#   │  │   Copia Lua plugin a /etc/nginx/lua/plugins/traceable/          │ │
#   │  │                                                                  │ │
#   │  │ Container 1: controller (ingress-nginx v1.10.1)                 │ │
#   │  │   Carga Lua plugin via ConfigMap (plugins: traceable)           │ │
#   │  │   Env: TA_ADDRESS=127.0.0.1, TA_SERVICE=nginx-ingress          │ │
#   │  │   Lua rewrite phase: llama TME ext_cap para blocking           │ │
#   │  │   Lua log phase: reporta spans via zipkin a TME                │ │
#   │  │                                                                  │ │
#   │  │ Container 2: tme (traceable-agent v1.71.2 sidecar)             │ │
#   │  │   ext_cap :5442 — evalua requests contra blocking policies     │ │
#   │  │   collector :9411 — recibe spans del Lua plugin (zipkin)       │ │
#   │  │   Forwards spans al TPA (agent.harnessbank-demo-end2end:5442)  │ │
#   │  │   Auth: TA_REFRESH_TOKEN (de token-secret en ns nginx)         │ │
#   │  │   Platform: api.us9.traceable.ai (via tme-template-override)   │ │
#   │  └──────────────────────────────────────────────────────────────────┘ │
#   │                                                                       │
#   │  ConfigMap: ingress-nginx-controller (plugins: traceable)             │
#   │  Secret: token-secret (copia del token para auth TME al platform)     │
#   └────────────────────────────────────────────────────────────────────────┘
#
# Communication flow:
#   ① Request → Nginx Lua plugin → TME ext_cap (/ext_cap/v1/req_cap)
#     TME evalua contra WAF/CRS + API Protection + Rate Limiting
#     Retorna {allowRequest: true|false}
#     Si false → Nginx retorna 403 Access Forbidden (nunca llega al app)
#
#   ② Lua plugin → TME collector (:9411, zipkin) para span reporting
#
#   ③ TME collector → TPA (:5442, zipkin) en ns harnessbank-demo-end2end
#
#   ④ eBPF tracer → TPA (spans de trafico E-W kernel-level)
#
#   ⑤ TPA → Traceable Platform (api.us9.traceable.ai)
#     Envia: spans, telemetria, detecciones
#     Recibe: blocking policies, CRS rules, sampling config (poll 30s)
#
#   ⑥ TPA → TME (distribuye policies via gRPC, ext_cap remote_config)
#
# Blocking matrix:
#   Custom Signatures (SQLi, XSS, CMDi) → Block 403 (CRS/ModSecurity en TME, firma determinista)
#   Malicious Sources (IP reputation)   → Block 403 (TME, lista de IPs maliciosos)
#   Rate Limiting                        → Block 429 (TME, threshold por endpoint/IP)
#   Data Loss Prevention                 → Block 403 (TME, patrones PII en responses)
#   Enumeration                          → Block 403 (TME, scraping/enumeration patterns)
#   Region Blocking                      → Block 403 (TME, geo-IP)
#   API Protection (BOLA)               → Monitor only (behavioral ML, riesgo de FP)
#   AI Firewall (Prompt Injection)      → Monitor only (ML detection, sin Block)
#
# Webhook dedup (3 TPAs en cluster):
#   traceable-agent-injector-harnessbank-demo-end2end → enabled (activo)
#   traceable-agent-injector-traceableai              → enabled-traceableai (desactivado)
#   traceable-agent-injector-brett                     → enabled-brett (desactivado)
#   Solo el webhook de harnessbank-demo-end2end inyecta TME en ns nginx.
#
# Setup sequence:
#   1. kubectl apply -f nginx-namespace-label.yaml
#   2. Run CDSimpleKubernetesDeployment pipeline with service=traceable_agent
#   3. kubectl rollout restart deployment ingress-nginx-controller -n nginx
#   4. Verify: kubectl get pods -n nginx (expect 2/2 READY)
#   5. Verify TME logs: no "agent token not found" errors
#   6. Check Traceable UI: Protection Policies → Block mode available
#
# See tpa-helm-values.yaml for the reference copy of Helm values.
# See nginx-namespace-label.yaml for the namespace label manifest.
