analysis:
  failed_stage: "Deploy"
  failed_step: "Canary_Deployment"
  failed_step_type: "K8sCanaryDeploy"
  failure_type: "rollout_progress_deadline"
  root_cause: >
    The Deployment manifest sets progressDeadlineSeconds: 20, which is 20 seconds.
    This is far below the Kubernetes default of 600s and is critically insufficient
    for a canary deployment. The container enters CrashLoopBackOff on startup
    (the pod starts, crashes, and restarts repeatedly), and Kubernetes cannot
    declare the rollout successful before the 20-second window expires.
    A secondary issue is readinessProbe.failureThreshold: 1, which marks the pod
    not-ready on the very first failed probe, compounding the problem during the
    crash-restart cycle. The image pulls successfully (1.4s) and the /health
    endpoint exists in the application code, but the pod never stabilizes within
    the allowed window.
  confidence: "high"
  evidence:
    - "deployment harnessbank-demo-canary exceeded its progress deadline"
    - "Event: Back-off restarting failed container harnessbank-demo in pod harnessbank-demo-canary-64b9994c9f-85xp2"
    - "Waiting for deployment harnessbank-demo-canary rollout to finish: 0 of 1 updated replicas are available"
    - "progressDeadlineSeconds: 20 observed in rendered manifest from execution logs"
    - "readinessProbe.failureThreshold: 1 in k8s/deployment.yaml"
    - "Container starts and is pulled successfully in ~1.4s but then crashes"

correlated_files:
  - file: "k8s/deployment.yaml"
    reason: "Contains progressDeadlineSeconds: 20 and readinessProbe.failureThreshold: 1, both directly responsible for the rollout failure"
  - file: "k8s/values.yaml"
    reason: "Harness values file used to render the deployment template; containerPort=3000 confirmed correct"
  - file: "app/app.py"
    reason: "Confirms /health endpoint exists at port 3000 returning 200 OK — probe path is correct"
  - file: "app/server.py"
    reason: "Calls init_db() at module load time; if DB initialization fails the container crashes immediately"

changes_applied:
  - file: "k8s/deployment.yaml"
    change: "Increase progressDeadlineSeconds from 20 to 300"
    before: |
      progressDeadlineSeconds: 20
    after: |
      progressDeadlineSeconds: 300
    rationale: >
      20 seconds is critically short for any Kubernetes deployment, especially a
      canary. The Kubernetes default is 600s. 300s gives the pod 5 minutes to
      stabilize, which is sufficient for the container to boot, pass readiness
      probes, and be declared ready — even if it requires one or two restart
      cycles during initialization.

  - file: "k8s/deployment.yaml"
    change: "Increase readinessProbe.failureThreshold from 1 to 3"
    before: |
      readinessProbe:
        httpGet:
          path: /health
          port: {{ .Values.containerPort }}
        initialDelaySeconds: 5
        periodSeconds: 3
        timeoutSeconds: 1
        failureThreshold: 1
    after: |
      readinessProbe:
        httpGet:
          path: /health
          port: {{ .Values.containerPort }}
        initialDelaySeconds: 5
        periodSeconds: 3
        timeoutSeconds: 1
        failureThreshold: 3
    rationale: >
      A failureThreshold of 1 means the pod is marked not-ready after a single
      failed probe check. Combined with the crash-restart cycle, this ensures the
      pod is never considered ready. Setting it to 3 matches the liveness probe
      and gives the pod 3 x 3s = 9 seconds of grace for transient startup failures.

validation:
  commands_run:
    - "YAML parse check: verified both before and after YAML is syntactically valid"
    - "Template variable check: all {{ .Values.* }} placeholders preserved unchanged"
    - "Cross-reference: /health endpoint confirmed in app/app.py at port 3000"
    - "Harness log review: rendered manifest confirmed progressDeadlineSeconds: 20 in failing execution"
  results:
    - "YAML syntax: valid"
    - "No Helm/values references broken"
    - "No other manifest fields modified"
    - "Health endpoint path /health confirmed correct in application source"

