rules:
  - id: demo-bank-sql-injection
    message: "Demo finding: SQL query appears to be built using string concatenation with user-controlled input."
    languages: [python]
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern: $SQL + $INPUT
    pattern-sinks:
      - pattern: $DB.execute(...)

  - id: demo-bank-command-injection
    message: "Demo finding: a shell command is executed with a dynamically constructed command string."
    languages: [python]
    severity: ERROR
    pattern-either:
      - pattern: subprocess.check_output($CMD, ..., shell=True, ...)
      - pattern: subprocess.run($CMD, ..., shell=True, ...)
      - pattern: subprocess.Popen($CMD, ..., shell=True, ...)
      - pattern: subprocess.call($CMD, ..., shell=True, ...)
      - pattern: os.system($CMD)

  - id: demo-bank-reflected-xss
    message: "Demo finding: response appears to reflect request query data directly into HTML."
    languages: [python]
    severity: WARNING
    # Matches the VULN-006 pattern: raw request.args value concatenated into an
    # HTML string literal that is returned to the client.
    patterns:
      - pattern-regex: '"<[^"]*"\s*\+\s*request\.args'
      - pattern-inside: |
          def $F(...):
            ...

  - id: demo-bank-insecure-cors
    message: "Demo finding: CORS allows all origins. Restrict origins for production applications."
    languages: [python]
    severity: WARNING
    pattern-either:
      - pattern: CORS($APP, origins="*")
      - pattern: CORS($APP, origins=["*"])

  - id: demo-bank-prompt-injection
    message: "Demo finding: user input is concatenated directly into an AI system prompt without sanitization, enabling prompt injection attacks."
    languages: [python]
    severity: ERROR
    patterns:
      - pattern-regex: '"\s*\+\s*message'
      - pattern-inside: |
          def $F(...):
            ...

  - id: demo-bank-pii-leak-ai-response
    message: "Demo finding: AI assistant response includes raw financial data (owner names, balances) without PII filtering."
    languages: [python]
    severity: WARNING
    patterns:
      - pattern: |
          $RESP = {..., "financial_context": $CONTEXT, ...}
          ...
          return jsonify($RESP)
      - pattern-inside: |
          def $F(...):
            ...

  - id: demo-bank-bola-idor
    message: "Demo finding: endpoint exposes sensitive account details without authorization check. Any user can access any account by ID (BOLA/IDOR)."
    languages: [python]
    severity: ERROR
    patterns:
      - pattern: |
          @$BP.route("/<id>/details", ...)
          def $FUNC(id):
            ...
      - pattern-not-inside: |
          def $FUNC(id):
            ...
            if not $AUTH(...):
              ...
