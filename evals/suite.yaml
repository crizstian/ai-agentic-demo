##############################################################################
# AI Evals — Two-Level Quality Gate
#
# Level 1 (CI):          Precomputed target, runs on every PR
# Level 2 (Post-deploy): Live agent target, runs after deployment
##############################################################################

# --- Level 1: CI Quality Gate (precomputed) --------------------------------
ci:
  name: MCP Agent Quality Gate
  suite_id: 5c1b48b4-004c-4f5f-aaba-a21f7854b16b
  pass_strategy: all_must_pass
  dataset: datasets/mcp-quality-gate.jsonl
  target:
    type: precomputed
  evals:
    - eval_id: mcp-financial-data-quality
      metrics:
        - score_name: ContainsMetric
          type: heuristic
          config: { kind: contains, threshold: 1.0 }
          dimension: correctness
        - score_name: PIIMetric
          type: heuristic
          config: { kind: pii, threshold: 1.0 }
          dimension: safety

# --- Level 2: Post-Deploy Live Validation ----------------------------------
post_deploy:
  name: MCP Agent Live Validation
  suite_id: a3045162-6d3e-4172-beb3-17dab6c7ff9f
  pass_strategy: all_must_pass
  dataset: datasets/mcp-live-validation.jsonl
  target:
    type: agent
    endpoint: http://demobank-e2e.selatam.harness-demo.site/api/ai/chat
    method: POST
    request_template: '{"message": "{{input.text}}", "session_id": "eval-{{metadata.category}}"}'
    response_path: response
    timeout_ms: 30000
  evals:
    - eval_id: mcp-live-quality
      metrics:
        - score_name: ContainsMetric
          type: heuristic
          config: { kind: contains, threshold: 1.0 }
          dimension: correctness
        - score_name: PIIMetric
          type: heuristic
          config: { kind: pii, threshold: 1.0 }
          dimension: safety

