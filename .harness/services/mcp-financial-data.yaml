service:
  name: mcp-financial-data
  identifier: mcp_financial_data
  orgIdentifier: sandbox
  projectIdentifier: CristianRamirez
  description: "MCP Financial Data mock service — East-West traffic generator for Traceable AI Security demo"
  serviceDefinition:
    type: Kubernetes
    spec:
      manifests:
        - manifest:
            identifier: mcp_financial_data_manifests
            type: K8sManifest
            spec:
              store:
                type: Github
                spec:
                  connectorRef: CristianConnector
                  repoName: ai-agentic-demo
                  gitFetchType: Branch
                  branch: secops/ai-agentic-demo-main
                  paths:
                    - deploy/k8s/mcp-financial-data/deployment.yaml
                    - deploy/k8s/mcp-financial-data/service.yaml
              valuesPaths:
                - deploy/k8s/mcp-financial-data/values.yaml
              skipResourceVersioning: false
      artifacts:
        primary:
          primaryArtifactRef: mcp_financial_data_image
          sources:
            - identifier: mcp_financial_data_image
              type: DockerRegistry
              spec:
                connectorRef: DockerCristian
                imagePath: crizstian/mcp-financial-data
                tag: <+input>
  tags:
    app: mcp-financial-data
    tier: internal
