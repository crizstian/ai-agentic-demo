service:
  name: traceable-agent
  identifier: traceable_agent
  orgIdentifier: sandbox
  projectIdentifier: CristianRamirez
  description: "Traceable Platform Agent (TPA) — API discovery, behavioral detection, threat scoring, blocking"
  serviceDefinition:
    type: NativeHelm
    spec:
      manifests:
        - manifest:
            identifier: traceable_agent_chart
            type: HelmChart
            spec:
              store:
                type: Http
                spec:
                  connectorRef: traceableai_helm_repo
              chartName: traceable-agent
              chartVersion: <+input>
              helmVersion: V3
              skipResourceVersioning: false
        - manifest:
            identifier: traceable_values_override
            type: Values
            spec:
              store:
                type: Inline
                spec:
                  content: |
                    token: <+serviceVariables.TRACEABLE_AGENT_TOKEN>
                    endpoint: api.us9.traceable.ai
                    environment: <+serviceVariables.TRACEABLE_ENVIRONMENT>
                    clusterName: <+serviceVariables.TRACEABLE_CLUSTER_NAME>
      variables:
        - name: TRACEABLE_CLUSTER_NAME
          type: String
          description: "Cluster name as registered in Traceable platform"
          value: se-sandbox
        - name: TRACEABLE_ENVIRONMENT
          type: String
          description: "Environment name in Traceable platform"
          value: harnessbank-demo-end2end
        - name: TRACEABLE_AGENT_TOKEN
          type: String
          description: "Agent token from app.traceable.ai"
          value: <+secrets.getValue("traceable_agent_token")>
  tags:
    app: traceable
    component: tpa
