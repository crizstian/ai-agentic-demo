pipeline:
  projectIdentifier: CristianRamirez
  orgIdentifier: sandbox
  identifier: AI_SDLC_DemoBank
  name: AI SDLC DemoBank
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: CristianConnector
        repoName: ai-agentic-demo
        build: <+input>
        sparseCheckout: []
  stages:
    - stage:
        name: Build
        identifier: CI
        description: "Acts 2-3: PR validation (lint, tests, AI review, security scan) and main branch build (SBOM, Docker push)"
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            paths: []
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - stepGroup:
                  name: PR Validation
                  identifier: PR_Pipeline
                  when:
                    stageStatus: Success
                    condition: <+trigger.event> == "PR"
                  steps:
                    - stepGroup:
                        name: Build Validation
                        identifier: Build_Validation
                        steps:
                          - step:
                              type: Run
                              name: Build and Lint
                              identifier: Build_and_Lint
                              spec:
                                shell: Sh
                                command: |-
                                  set -eu
                                  echo "Branch: <+codebase.branch>"
                                  echo "PR Title: <+trigger.prTitle>"
                                  pip install --quiet -r requirements.txt
                                  python -m py_compile app/server.py
                                  echo "Build validation passed"
                          - step:
                              type: Test
                              name: Test Intelligence
                              identifier: Test_Intelligence
                              spec:
                                shell: Sh
                                command: |-
                                  pip install -r requirements-dev.txt
                                  pytest --junitxml=test-results/junit.xml
                                reports:
                                  type: JUnit
                                  spec:
                                    paths:
                                      - test-results/junit.xml
                                intelligenceMode: true
                              failureStrategies:
                                - onFailure:
                                    errors:
                                      - AllErrors
                                    action:
                                      type: MarkAsSuccess
                              when:
                                stageStatus: Success
                          - step:
                              type: Agent
                              name: Change Advisor
                              identifier: Change_Advisor
                              spec:
                                agentName: code_reviewer
                                agentSettings:
                                  llmConnector: account.harnessAnthropic
                                  mcpConnectors:
                                    - mcp_harness_cristian
                                    - mcp_github_cristian
                                  modelName: claude-sonnet-4-6
                              when:
                                stageStatus: Success
                            contextType: Pipeline
                          - step:
                              type: Agent
                              name: Quality Agent
                              identifier: Quality_Agent
                              spec:
                                agentName: ca_code_unit_test_generator
                                agentSettings:
                                  llmConnector: account.harnessAnthropic
                                  mcpConnectors:
                                    - mcp_harness_cristian
                                    - mcp_github_cristian
                                  modelName: claude-sonnet-4-5-20250929
                              when:
                                stageStatus: Success
                            contextType: Pipeline
                    - stepGroup:
                        name: Security Scanning and Remediation
                        identifier: Security_Scanning
                        steps:
                          - parallel:
                              - step:
                                  type: Gitleaks
                                  name: Secrets Detection
                                  identifier: Secrets_Detection
                                  spec:
                                    mode: orchestration
                                    config: default
                                    target:
                                      type: repository
                                      detection: auto
                                    advanced:
                                      log:
                                        level: info
                              - step:
                                  type: HarnessSAST
                                  name: Harness SCA
                                  identifier: Harness_SCA
                                  spec:
                                    mode: orchestration
                                    config: sca
                                    target:
                                      type: repository
                                      detection: auto
                                    advanced:
                                      log:
                                        level: info
                              - step:
                                  type: Semgrep
                                  name: Semgrep_SAST
                                  identifier: Semgrep_SAST
                                  spec:
                                    mode: orchestration
                                    config: default
                                    target:
                                      type: repository
                                      workspace: app/
                                      detection: auto
                                    advanced:
                                      log:
                                        level: info
                          - step:
                              type: Agent
                              name: Security Remediator
                              identifier: Security_Remediator
                              spec:
                                agentName: security_analyzer
                                agentSettings:
                                  llmConnector: account.harnessAnthropic
                                  mcpConnectors:
                                    - mcp_harness_cristian
                                    - mcp_github_cristian
                                  modelName: claude-sonnet-4-6
                              when:
                                stageStatus: Success
                                condition: <+pipeline.stages.CI.spec.execution.steps.PR_Pipeline.steps.Security_Scanning.steps.Semgrep_SAST.output.outputVariables.HIGH> > 0
                            contextType: Pipeline
                    - step:
                        type: Run
                        name: Apply Fixes
                        identifier: Apply_Fixes
                        spec:
                          shell: Bash
                          command: |-
                            #!/bin/bash
                            set -euo pipefail

                            echo "=== Apply Fixes — Checking for agent changes ==="

                            if [ -z "$(git status --porcelain)" ]; then
                              echo "No agent changes detected — clean pass"
                              exit 0
                            fi

                            echo "=== Changes detected from AI agents ==="
                            git status --short
                            echo ""

                            SOURCE_BRANCH="<+trigger.sourceBranch>"

                            git config user.email "harness-ai-agent@harness.io"
                            git config user.name "Harness AI Agent"

                            # Set up auth for push
                            CURRENT_URL=$(git remote get-url origin)
                            if [[ "$CURRENT_URL" != *"x-access-token"* ]]; then
                              AUTH_URL=$(echo "$CURRENT_URL" | sed "s|https://|https://x-access-token:${HARNESS_TOKEN}@|")
                              git remote set-url origin "$AUTH_URL"
                            fi

                            # Stage all agent changes
                            git add -A

                            # Handle detached HEAD (common in PR checkout)
                            CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
                            if [ "$CURRENT_BRANCH" = "HEAD" ]; then
                              echo "Detached HEAD — switching to $SOURCE_BRANCH"
                              git stash
                              git fetch origin "$SOURCE_BRANCH"
                              git checkout -B "$SOURCE_BRANCH" "origin/$SOURCE_BRANCH"
                              git stash pop
                              git add -A
                            fi

                            git commit -m "fix: AI agent auto-remediation — tests + security fixes"

                            # Push to source branch — re-triggers pipeline
                            git push origin HEAD:"$SOURCE_BRANCH"

                            echo "=== Fixes committed and pushed to $SOURCE_BRANCH ==="
                        when:
                          stageStatus: Success
              - stepGroup:
                  name: Build and Supply Chain
                  identifier: Supply_Chain_Governance
                  steps:
                    - parallel:
                        - step:
                            type: BuildAndPushDockerRegistry
                            name: Build DemoBank Image
                            identifier: Build_DemoBank
                            spec:
                              connectorRef: DockerCristian
                              repo: docker.io/crizstian/harnessbank-demo
                              tags:
                                - latest
                                - <+pipeline.sequenceId>
                              caching: true
                              dockerfile: Dockerfile
                          contextType: Pipeline
                        - step:
                            type: BuildAndPushDockerRegistry
                            name: Build MCP Financial Data
                            identifier: Build_MCP
                            spec:
                              connectorRef: DockerCristian
                              repo: docker.io/crizstian/mcp-financial-data
                              tags:
                                - latest
                                - <+pipeline.sequenceId>
                              caching: true
                              dockerfile: services/mcp-financial-data/Dockerfile
                              context: services/mcp-financial-data
                          contextType: Pipeline
                    - parallel:
                        - step:
                            type: SscaOrchestration
                            name: SBOM DemoBank
                            identifier: SBOM_DemoBank
                            spec:
                              mode: generation
                              tool:
                                type: cdxgen
                                spec:
                                  format: cyclonedx-json
                              source:
                                type: docker
                                spec:
                                  connector: DockerCristian
                                  image: docker.io/crizstian/harnessbank-demo:<+pipeline.sequenceId>
                              attestation:
                                type: keyless
                                spec:
                                  oidcProvider: harness
                              resources:
                                limits:
                                  memory: 500Mi
                                  cpu: "0.5"
                          contextType: Pipeline
                        - step:
                            type: SscaOrchestration
                            name: SBOM MCP Financial Data
                            identifier: SBOM_MCP
                            spec:
                              mode: generation
                              tool:
                                type: cdxgen
                                spec:
                                  format: cyclonedx-json
                              source:
                                type: docker
                                spec:
                                  connector: DockerCristian
                                  image: docker.io/crizstian/mcp-financial-data:<+pipeline.sequenceId>
                              attestation:
                                type: keyless
                                spec:
                                  oidcProvider: harness
                              resources:
                                limits:
                                  memory: 500Mi
                                  cpu: "0.5"
                          contextType: Pipeline
                    - parallel:
                        - step:
                            type: provenance
                            name: SLSA DemoBank
                            identifier: SLSA_DemoBank
                            spec:
                              source:
                                type: docker
                                spec:
                                  connector: DockerCristian
                                  repo: docker.io/crizstian/harnessbank-demo:<+pipeline.sequenceId>
                              attestation:
                                type: keyless
                                spec:
                                  oidcProvider: harness
                              resources:
                                limits:
                                  memory: 500Mi
                                  cpu: "0.5"
                        - step:
                            type: provenance
                            name: SLSA MCP Financial
                            identifier: SLSA_MCP_Financial
                            spec:
                              source:
                                type: docker
                                spec:
                                  connector: DockerCristian
                                  repo: docker.io/crizstian/mcp-financial-data:<+pipeline.sequenceId>
                              attestation:
                                type: keyless
                                spec:
                                  oidcProvider: harness
                              resources:
                                limits:
                                  memory: 500Mi
                                  cpu: "0.5"
                    - parallel:
                        - step:
                            type: SscaArtifactSigning
                            name: Artifact DemoBank
                            identifier: Artifact_DemoBank
                            spec:
                              source:
                                type: docker
                                spec:
                                  connector: DockerCristian
                                  image: docker.io/crizstian/harnessbank-demo:<+pipeline.sequenceId>
                              signing:
                                type: keyless
                                spec:
                                  oidcProvider: harness
                              resources:
                                limits:
                                  memory: 500Mi
                                  cpu: "0.5"
                        - step:
                            type: SscaArtifactSigning
                            name: Artifact MCP Financial
                            identifier: Artifact_MCP_Financial
                            spec:
                              source:
                                type: docker
                                spec:
                                  connector: DockerCristian
                                  image: docker.io/crizstian/mcp-financial-data:<+pipeline.sequenceId>
                              signing:
                                type: keyless
                                spec:
                                  oidcProvider: harness
                              resources:
                                limits:
                                  memory: 500Mi
                                  cpu: "0.5"
                  when:
                    stageStatus: Success
                    condition: (<+codebase.build.type> == "branch" && <+codebase.branch> == "secops/ai-agentic-demo-main")
              - step:
                  type: Run
                  name: AI SRE Build Notification
                  identifier: AISRE_Build_Notification
                  spec:
                    shell: Sh
                    command: |-
                      #!/bin/bash
                      json_payload="{\
                      \"artifact\": {\"name\": \"docker.io/docker.io/crizstian/harnessbank-demo\", \"version\": \"<+pipeline.sequenceId>\"}, \
                      \"source\": {\
                      \"commitSha\": \"<+codebase.commitSha>\", \
                      \"kind\": \"branch\", \
                      \"value\": \"<+codebase.branch>\", \
                      \"repository_url\": \"https://github.com/crizstian/ai-agentic-demo\"}, \
                      \"service\": {\"name\": \"harnessbank-demo\", \"version\": \"<+pipeline.sequenceId>\"}, \
                      \"buildId\": \"<+pipeline.executionId>\"}"

                      curl '<+secrets.getValue("aisre_build_webhook_url")>' \
                        -s \
                        -H 'Content-Type: application/json' \
                        -d "$json_payload"
                  when:
                    stageStatus: Success
                    condition: (<+codebase.build.type> == "branch" && <+codebase.branch> == "secops/ai-agentic-demo-main")
          buildIntelligence:
            enabled: false
        variables:
          - name: HARNESS_TOKEN
            type: String
            description: ""
            required: false
            value: <+secrets.getValue("pat")>
    - stage:
        name: Deploy DemoBank
        identifier: Deploy_DemoBank
        description: "Act 4: Governed canary deployment"
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: demobank
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      sources:
                        - identifier: demobank_image
                          type: DockerRegistry
                          spec:
                            tag: <+pipeline.sequenceId>
          environment:
            environmentRef: gke_latam
            deployToAll: false
            infrastructureDefinitions:
              - identifier: latam_nodepool
          execution:
            steps:
              - stepGroup:
                  name: Supply Chain
                  identifier: Supply_Chain
                  steps:
                    - parallel:
                        - step:
                            type: SscaEnforcement
                            name: SBOM DemoBank
                            identifier: SBOM_DemoBank
                            spec:
                              source:
                                type: docker
                                spec:
                                  connector: DockerCristian
                                  image: docker.io/crizstian/harnessbank-demo:<+pipeline.sequenceId>
                              verifyAttestation:
                                type: keyless
                                spec:
                                  oidcProvider: harness
                              policy:
                                policySets:
                                  - SSCA
                              resources:
                                limits:
                                  memory: 500Mi
                                  cpu: "0.5"
                        - step:
                            type: SlsaVerification
                            name: SLSA Verification
                            identifier: SLSA_Verification
                            spec:
                              source:
                                type: Docker
                                spec:
                                  connector: DockerCristian
                                  image_path: docker.io/crizstian/harnessbank-demo:<+pipeline.sequenceId>
                              verify_attestation:
                                type: keyless
                                spec:
                                  oidcProvider: harness
                              resources:
                                limits:
                                  memory: 500Mi
                                  cpu: "0.5"
                        - step:
                            type: SscaArtifactVerification
                            name: Artifact Verification
                            identifier: Artifact_Verification
                            spec:
                              source:
                                type: docker
                                spec:
                                  connector: DockerCristian
                                  image: docker.io/crizstian/harnessbank-demo:<+pipeline.sequenceId>
                              verifySign:
                                type: keyless
                                spec:
                                  oidcProvider: harness
                              resources:
                                limits:
                                  memory: 500Mi
                                  cpu: "0.5"
                  stepGroupInfra:
                    type: KubernetesDirect
                    spec:
                      connectorRef: org.se_sandbox_k8s
              - stepGroup:
                  name: Canary Deployment
                  identifier: canaryDeployment
                  steps:
                    - step:
                        type: K8sCanaryDeploy
                        name: Canary Deployment
                        identifier: Canary_Deployment
                        spec:
                          skipDryRun: false
                          instanceSelection:
                            type: Count
                            spec:
                              count: 2
                        timeout: 10m
                    - step:
                        name: Canary Delete
                        identifier: canaryDelete
                        type: K8sCanaryDelete
                        timeout: 10m
                        spec: {}
                      contextType: Pipeline
              - stepGroup:
                  name: Primary Deployment
                  identifier: primaryDeployment
                  steps:
                    - step:
                        name: Rolling Deployment
                        identifier: rollingDeployment
                        type: K8sRollingDeploy
                        timeout: 10m
                        spec:
                          skipDryRun: false
              - step:
                  type: ShellScript
                  name: AI SRE Deploy Notification
                  identifier: AISRE_Deploy_Notification
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: |-
                          #!/bin/bash
                          json_payload="{\
                          \"services\": [\
                          {\"service\": \"harnessbank-demo\", \"version\": \"<+pipeline.sequenceId>\"}, \
                          {\"service\": \"mcp-financial-data\", \"version\": \"<+pipeline.sequenceId>\"}], \
                          \"environments\": [\"gke-latam\"], \
                          \"changeId\": \"<+pipeline.executionId>\", \
                          \"status\": \"SUCCESS\", \
                          \"deployedBy\": \"<+pipeline.triggeredBy.name>\", \
                          \"deployTimestamp\": \"<+pipeline.startTs>\"}"

                          curl '<+secrets.getValue("aisre_deploy_webhook_url")>' \
                            -s \
                            -H 'Content-Type: application/json' \
                            -d "$json_payload"
                  timeout: 1m
            rollbackSteps:
              - step:
                  name: Canary Delete
                  identifier: rollbackCanaryDelete
                  type: K8sCanaryDelete
                  timeout: 10m
                  spec: {}
              - step:
                  name: Rolling Rollback
                  identifier: rollingRollback
                  type: K8sRollingRollback
                  timeout: 10m
                  spec: {}
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
        when:
          pipelineStatus: Success
          condition: (<+codebase.build.type> == "branch" && <+codebase.branch> == "secops/ai-agentic-demo-main")
    - stage:
        name: Deploy MCP Financial Data
        identifier: Deploy_MCP
        description: Deploy East-West traffic service for Traceable demo
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: mcp_financial_data
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      sources:
                        - identifier: mcp_financial_data_image
                          type: DockerRegistry
                          spec:
                            tag: <+pipeline.sequenceId>
          environment:
            useFromStage:
              stage: Deploy_DemoBank
          execution:
            steps:
              - stepGroup:
                  name: Supply Chain
                  identifier: Supply_Chain
                  steps:
                    - parallel:
                        - step:
                            type: SscaEnforcement
                            name: SBOM DemoBank
                            identifier: SBOM_DemoBank
                            spec:
                              source:
                                type: docker
                                spec:
                                  connector: DockerCristian
                                  image: docker.io/crizstian/mcp-financial-data:<+pipeline.sequenceId>
                              verifyAttestation:
                                type: keyless
                                spec:
                                  oidcProvider: harness
                              policy:
                                policySets:
                                  - SSCA
                              resources:
                                limits:
                                  memory: 500Mi
                                  cpu: "0.5"
                        - step:
                            type: SlsaVerification
                            name: SLSA Verification
                            identifier: SLSA_Verification
                            spec:
                              source:
                                type: Docker
                                spec:
                                  connector: DockerCristian
                                  image_path: docker.io/crizstian/mcp-financial-data:<+pipeline.sequenceId>
                              verify_attestation:
                                type: keyless
                                spec:
                                  oidcProvider: harness
                              resources:
                                limits:
                                  memory: 500Mi
                                  cpu: "0.5"
                        - step:
                            type: SscaArtifactVerification
                            name: Artifact Verification
                            identifier: Artifact_Verification
                            spec:
                              source:
                                type: docker
                                spec:
                                  connector: DockerCristian
                                  image: docker.io/crizstian/mcp-financial-data:<+pipeline.sequenceId>
                              verifySign:
                                type: keyless
                                spec:
                                  oidcProvider: harness
                              resources:
                                limits:
                                  memory: 500Mi
                                  cpu: "0.5"
                  stepGroupInfra:
                    type: KubernetesDirect
                    spec:
                      connectorRef: org.se_sandbox_k8s
              - step:
                  name: Rolling Deployment
                  identifier: rollingDeployment
                  type: K8sRollingDeploy
                  timeout: 10m
                  spec:
                    skipDryRun: false
            rollbackSteps:
              - step:
                  name: Rolling Rollback
                  identifier: rollingRollback
                  type: K8sRollingRollback
                  timeout: 10m
                  spec: {}
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
        when:
          pipelineStatus: Success
          condition: (<+codebase.build.type> == "branch" && <+codebase.branch> == "secops/ai-agentic-demo-main")
    - stage:
        name: External Traffic Generation
        identifier: External_Traffic
        description: Generate N-S traffic from Harness Cloud for Traceable API discovery and baseline learning
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Generate N-S Traffic
                  identifier: Generate_NS_Traffic
                  spec:
                    shell: Sh
                    command: |-
                      npm install -g newman --silent
                      BASE_URL="http://demobank-e2e.selatam.harness-demo.site"

                      echo "=== Generating external N-S traffic for Traceable API baseline ==="
                      echo "Source: Harness Cloud (public IP) -> Ingress -> DemoBank"
                      echo "Target: $BASE_URL"

                      for i in $(seq 1 10); do
                        echo "--- Cycle $i/10 ---"
                        newman run deploy/k8s/newman-traffic/collection.json \
                          --env-var "baseUrl=$BASE_URL" \
                          --timeout-request 10000 \
                          --suppress-exit-code || true

                        newman run deploy/k8s/newman-traffic/ai-collection.json \
                          --env-var "baseUrl=$BASE_URL" \
                          --timeout-request 10000 \
                          --suppress-exit-code || true

                        sleep 5
                      done
                      echo "=== External traffic generation complete: 10 cycles x 35 requests = 350 N-S requests ==="
          buildIntelligence:
            enabled: false
        when:
          pipelineStatus: Success
          condition: (<+codebase.build.type> == "branch" && <+codebase.branch> == "secops/ai-agentic-demo-main")
