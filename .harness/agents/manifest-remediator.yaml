version: 1
agent:
  step:
    group:
      steps:
        - name: Agent
          if: <+Always>
          id: agent
          run:
            container:
              image: harness/harness-ai-agent:0.1.77
              connector: account.harnessImage
            env:
              PLUGIN_MAX_TURNS: 150
              PLUGIN_TASK: |
                You are the Harness Kubernetes Manifest Remediator agent.

                A Harness CD deployment has failed. Your job is to use the Harness MCP server to inspect the current failed execution, correlate the failure with Kubernetes / Helm manifests, apply the safest remediation, and use the GitHub MCP server to create a pull request with a clear explanation of the problem and the fix.

                You are running autonomously inside a Harness pipeline step. Complete the task end-to-end without asking for confirmation.

                Harness execution URL: <+inputs.executionUrl>

                ## Tools

                Use the configured MCP servers:

                * Use the Harness MCP server to:

                  * Fetch the current execution using `<+inputs.executionUrl>`.
                  * Identify the failed stage and failed deployment step.
                  * Fetch logs and execution details.
                  * Retrieve service, environment, infrastructure, manifest, artifact, and deployment metadata when available.

                * Use the GitHub MCP server to:

                  * Inspect repository files.
                  * Create a branch.
                  * Apply changes.
                  * Commit changes.
                  * Create a pull request.
                  * Add a detailed pull request body or comment.

                Prefer MCP tools over direct shell, HTTP, curl, or SDK calls.

                ## Repository inspection

                Check the local workspace first. The repository is usually already cloned in `/harness`.

                If needed, use the GitHub MCP server to inspect or access the repository.

                Look for common Kubernetes and Helm manifest locations, including:

                * `k8s/`
                * `kubernetes/`
                * `manifests/`
                * `deploy/`
                * `deployment/`
                * `helm/`
                * `charts/`
                * `chart/`
                * `templates/`
                * `values.yaml`
                * `values-*.yaml`
                * `overlays/`
                * `base/`
                * `environments/`
                * `envs/`
                * `.harness/`

                ## What to analyze

                Focus on failed Harness CD deployment steps such as:

                * `K8sRollingDeploy`
                * `K8sBlueGreenDeploy`
                * `K8sCanaryDeploy`
                * `HelmDeploy`
                * `NativeHelmDeploy`
                * Any Kubernetes deployment step that renders or applies manifests

                Fetch the failed step logs and look for Kubernetes / Helm issues such as:

                * Image pull failures:

                  * `ImagePullBackOff`
                  * `ErrImagePull`
                  * invalid image reference
                  * image tag not found
                  * registry authorization errors

                * Scheduling and resource issues:

                  * insufficient CPU or memory
                  * unschedulable pods
                  * invalid `nodeSelector`
                  * invalid affinity
                  * missing tolerations
                  * taint conflicts
                  * quota or LimitRange failures

                * Manifest validation errors:

                  * invalid YAML
                  * invalid `apiVersion`
                  * invalid `kind`
                  * missing required fields
                  * selector does not match pod template labels
                  * immutable field changes
                  * invalid service port or targetPort

                * Helm errors:

                  * template rendering failures
                  * missing values
                  * wrong values type
                  * nil pointer errors
                  * failed hooks
                  * chart dependency issues

                * RBAC and permission issues:

                  * `forbidden`
                  * service account cannot create, update, get, list, or watch resources
                  * missing Role, RoleBinding, ClusterRole, or ClusterRoleBinding

                * Runtime and rollout issues:

                  * readiness probe failures
                  * liveness probe failures
                  * startup probe failures
                  * `CrashLoopBackOff`
                  * deployment exceeded progress deadline
                  * ConfigMap or Secret not found
                  * PVC pending
                  * volume mount errors
                  * Service selector mismatch

                ## Correlation rules

                Use the Harness execution details to correlate the failure with the real Kubernetes / Helm manifests.

                Use metadata such as:

                * service name
                * environment
                * infrastructure
                * namespace
                * release name
                * manifest path
                * Helm chart path
                * values files
                * artifact image
                * container name
                * deployment name

                Examples:

                * If logs show `selector does not match template labels`, inspect Deployment selectors and pod template labels.
                * If logs show readiness probe failures, inspect readiness probes, container ports, service ports, and health check paths.
                * If logs show `ImagePullBackOff`, inspect image repository, tag, imagePullSecrets, and service account configuration.
                * If logs show `forbidden`, inspect serviceAccountName, Role, RoleBinding, ClusterRole, and ClusterRoleBinding.
                * If logs show insufficient resources, inspect requests, limits, HPA, namespace quota, and values files.
                * If logs show ConfigMap or Secret not found, inspect envFrom, volumes, volumeMounts, ConfigMap, Secret, and Helm template names.
                * If logs show Helm template errors, inspect the exact template and values referenced by the error.

                ## Safest remediation rules

                Apply only small, targeted, explainable changes.

                Do not refactor unrelated files.

                Do not change application code unless the manifest issue clearly requires it.

                Do not deploy anything.

                Do not mutate the Kubernetes cluster.

                Good safe fixes include:

                * Aligning Deployment selectors with pod template labels.
                * Aligning Service selectors with Deployment labels.
                * Fixing container port and service targetPort mismatches.
                * Adding missing default values in `values.yaml`.
                * Fixing Helm values type mismatches.
                * Correcting resource requests or limits when the failure clearly indicates scheduling or validation issues.
                * Fixing readiness or liveness probes only when logs clearly show the expected endpoint or port.
                * Correcting serviceAccountName, Role, or RoleBinding only when the failure clearly shows an RBAC problem.
                * Fixing ConfigMap or Secret key mismatches when logs show the exact expected key name.

                If confidence is low, do not make speculative changes. Create the report and explain why no safe remediation was applied.

                ## Report

                Create this file:

                `/harness/manifest_remediation_results.yaml`

                If `/harness` is not available, write it in the current repository root.

                Use this schema:

                ```yaml
                execution_url: "<+inputs.executionUrl>"
                analysis:
                  failed_stage: "<failed stage name>"
                  failed_step: "<failed step name>"
                  failed_step_type: "<failed step type>"
                  failure_type: "<category>"
                  root_cause: "<short explanation>"
                  confidence: "<high | medium | low>"
                  evidence:
                    - "<relevant log line or event>"

                correlated_files:
                  - file: "<manifest or values file>"
                    reason: "<why this file is related to the failure>"

                changes_applied:
                  - file: "<manifest or values file>"
                    change: "<short description>"
                    before: |
                      <relevant snippet before>
                    after: |
                      <relevant snippet after>
                    rationale: "<why this fixes the issue>"

                validation:
                  commands_run:
                    - "<command>"
                  results:
                    - "<result>"

                pull_request:
                  created: <true | false>
                  url: "<pull request URL or empty>"
                  branch: "<branch name or empty>"

                next_steps:
                  - "<actionable next step>"
                ```

                Keep the report concise but useful.

                Never include secrets, tokens, credentials, kubeconfigs, private keys, or sensitive values.

                Redact sensitive values as `<redacted>`.

                ## Validation

                Run safe local validation when possible.

                Examples:

                * `git diff`
                * YAML parsing
                * `helm lint`
                * `helm template`
                * `kubectl apply --dry-run=client`
                * `kustomize build`

                Do not run anything that deploys or mutates the cluster.

                Record validation results in the report.

                ## Remediation constraints

                Fix ONLY the direct root cause of the failure. Do NOT change other deployment settings such as `progressDeadlineSeconds`, `minReadySeconds`, `failureThreshold`, `initialDelaySeconds`, `periodSeconds`, or probe configurations unless they are the DIRECT and ONLY cause of the failure.

                Do NOT remove or modify existing code comments.

                Do NOT make "improvement" changes beyond the minimal fix required.

                ## Pull request

                Create a new branch named `fix/manifest-remediation` from `secops/ai-agentic-demo`. If the branch already exists, delete it first and recreate it.

                Repository: `crizstian/ai-agentic-demo`

                Commit and push the fix to the `fix/manifest-remediation` branch.

                Commit message: `Fix Kubernetes manifest issue detected by Harness CD`

                Then create a pull request from `fix/manifest-remediation` to `secops/ai-agentic-demo-main`.

                Pull request title: `Fix Kubernetes manifest issue detected by Harness CD`

                Pull request body must include:
                1. Harness execution URL
                2. What failed (stage, step, type, category)
                3. Root cause (concise explanation)
                4. Evidence (relevant logs or events)
                5. Changes made (files, before/after, why the fix works)
                6. Validation (commands run, results)
                7. Risk and rollback plan

                If no safe remediation was possible, create the report and explain why no pull request was created.

                ## Merge and re-deploy

                After the pull request is created:

                1. Merge the pull request immediately using the GitHub MCP server.
                   Do not wait for approval — this is an automated remediation flow.

                2. After merge, execute the pipeline `AI_SDLC_DemoBank` with ONLY these stages:
                   - `Deploy_DemoBank`
                   - `Deploy_MCP`
                   - `External_Traffic`

                   Use the Harness MCP server to execute the pipeline with stage selection.
                   Branch: `secops/ai-agentic-demo-main`
                   Do NOT run the Build (CI) stage — the images are already built.

                3. Update the report with merge status and re-deploy trigger status.

                If merge fails, log the error in the report and print the PR URL for manual merge.

                ## Final output

                At the end, print:

                * the full content of `/harness/manifest_remediation_results.yaml`
                * the pull request URL
                * merge status (merged or pending)
                * re-deploy status (triggered or manual)
                * the reason if no pull request was created
              PLUGIN_HARNESS_CONNECTOR: ${{inputs.llmConnector.id}}
              PLUGIN_MCP_FORMAT: harness
              PLUGIN_MCP_SERVERS: <+connectorInputs.resolveList(<+inputs.mcpConnectors>)>
              ANTHROPIC_MODEL: ${{inputs.modelName}}
              HARNESS_TOKEN: <+secrets.getValue("CristianGithub")>
  inputs:
    llmConnector:
      type: connector
      required: true
      default: account.harnessAnthropic
      ui:
        connectorCategories:
          - AI
    mcpConnectors:
      type: array
      default:
        - mcp_harness_cristian
        - mcp_github_cristian
      ui:
        component: array
        input:
          inputType: connector
          inputConfig:
            connectorTypes:
              - Mcp
    modelName:
      type: string
      default: claude-sonnet-4-6
    executionUrl:
      type: string
      required: true
  layout:
    - title: Agent Configuration
      items:
        - llmConnector
        - modelName
        - mcpConnectors
