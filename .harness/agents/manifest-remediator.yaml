version: 1
agent:
  step:
    group:
      steps:
        - name: Agent
          if: <+Always>
          id: agent
          run:
            container:
              image: harness/harness-ai-agent:0.1.77
              connector: account.harnessImage
            env:
              PLUGIN_MAX_TURNS: 30
              PLUGIN_TASK: |
                You are the Kubernetes Manifest Remediator. A CD deployment failed.
                Diagnose, fix, PR, merge — fully autonomous.

                Execution URL: <+inputs.executionUrl>
                Jira Key: <+pipeline.variables.jiraKey>
                Repo: crizstian/ai-agentic-demo
                Manifests: deploy/k8s/demobank/
                Source branch: secops/ai-agentic-demo
                Target branch: secops/ai-agentic-demo-main

                ## Known failure scenario
                The deployment.yaml references OPENAI_API_KEY via configMapKeyRef
                from ConfigMap harnessbank-demo-end2end-config, but the ConfigMap
                (configmap.yaml) is missing that key. The fix is to add the
                OPENAI_API_KEY key to configmap.yaml with a placeholder value.

                NEVER create a secret.yaml file. The Harness service only deploys
                files already registered in the service manifest (deployment.yaml,
                configmap.yaml, service.yaml, values.yaml). New files will NOT be
                deployed to the cluster.

                ## Process
                1. Fetch the failed execution via Harness MCP. Get logs from the
                   failed deploy step. Confirm the error is a missing ConfigMap key.
                2. Read deploy/k8s/demobank/configmap.yaml from GitHub MCP
                   (branch: secops/ai-agentic-demo). Verify OPENAI_API_KEY is missing.
                3. Add the missing key to configmap.yaml:
                   OPENAI_API_KEY: "sk-placeholder-for-demo"
                   Do NOT modify deployment.yaml. Do NOT create new files.
                4. Create branch fix/manifest-remediation from secops/ai-agentic-demo
                   (delete first if exists). Push ONLY configmap.yaml.
                   Commit message MUST be exactly:
                   "Fix Kubernetes manifest: add OPENAI_API_KEY to ConfigMap [<+pipeline.variables.jiraKey>]"
                5. Create PR to secops/ai-agentic-demo-main with:
                   - Title: "Fix Kubernetes manifest: add OPENAI_API_KEY to ConfigMap [<+pipeline.variables.jiraKey>]"
                   - Body: What failed, Root cause (missing key in ConfigMap), Fix applied
                6. Merge the PR immediately (squash merge).
                7. Delete the fix branch (fix/manifest-remediation) after merge.
                8. STOP. The kubernetes_fix_deploy_trigger fires automatically on merge.
                   Do NOT manually execute any pipeline.

                IMPORTANT: Every commit message and PR title MUST contain:
                - The word "manifest" (triggers the re-deploy pipeline)
                - The Jira key: <+pipeline.variables.jiraKey>

                If confidence is low, create the PR but do NOT merge. Print the URL.
              PLUGIN_HARNESS_CONNECTOR: ${{inputs.llmConnector.id}}
              PLUGIN_MCP_FORMAT: harness
              PLUGIN_MCP_SERVERS: <+connectorInputs.resolveList(<+inputs.mcpConnectors>)>
              ANTHROPIC_MODEL: ${{inputs.modelName}}
              HARNESS_TOKEN: <+secrets.getValue("harnessToken")>
  inputs:
    llmConnector:
      type: connector
      required: true
      default: account.harnessAnthropic
      ui:
        connectorCategories:
          - AI
    mcpConnectors:
      type: array
      default:
        - mcp_harness_cristian
        - mcp_github_cristian
      ui:
        component: array
        input:
          inputType: connector
          inputConfig:
            connectorTypes:
              - Mcp
    modelName:
      type: string
      default: claude-sonnet-4-6
    executionUrl:
      type: string
      required: true
  layout:
    - title: Agent Configuration
      items:
        - llmConnector
        - modelName
        - mcpConnectors
