version: 1
agent:
  step:
    group:
      steps:
        - name: Agent
          if: <+Always>
          id: agent
          run:
            container:
              image: harness/harness-ai-agent:0.1.77
              connector: account.harnessImage
            env:
              PLUGIN_MAX_TURNS: 30
              PLUGIN_TASK: |
                You are the Kubernetes Manifest Remediator. A CD deployment failed.
                Diagnose, fix, PR, merge, and re-deploy — fully autonomous.

                Execution URL: <+inputs.executionUrl>
                Repo: crizstian/ai-agentic-demo
                Manifests: deploy/k8s/demobank/

                ## Process
                1. Fetch the failed execution via Harness MCP. Get logs from the
                   failed deploy step. Identify the error.
                2. Read the relevant manifest in deploy/k8s/demobank/ (local /harness
                   first, GitHub MCP fallback). Common failures:
                   - ConfigMap/Secret key mismatch (envFrom, configMapKeyRef)
                   - Image pull errors (tag, registry, imagePullSecrets)
                   - Selector/label mismatch
                   - Probe misconfiguration
                3. Apply the minimal fix. Do NOT refactor, do NOT change unrelated
                   files, do NOT modify application code.
                4. Validate: kubectl apply --dry-run=client -f <file>
                5. Create branch fix/manifest-remediation from secops/ai-agentic-demo
                   (delete first if exists). Commit + push.
                   Message: "Fix Kubernetes manifest issue detected by Harness CD"
                6. Create PR to secops/ai-agentic-demo-main with:
                   - What failed (stage, step, error)
                   - Root cause
                   - Fix applied (before/after)
                   - Validation result
                7. Merge the PR immediately (automated remediation, no approval needed).
                8. Extract sequenceId from the FAILED execution (pipeline run number =
                   Docker image tag). Execute pipeline AI_SDLC_DemoBank with ONLY:
                   - Deploy_DemoBank
                   - Deploy_MCP
                   - External_Traffic
                   Branch: secops/ai-agentic-demo-main
                   Variable imageTag = sequenceId from step 8.
                   Do NOT run CI stage — images already built.

                If confidence is low, create the PR but do NOT merge. Print the URL.

                STOP after triggering re-deploy. Do not iterate.
              PLUGIN_HARNESS_CONNECTOR: ${{inputs.llmConnector.id}}
              PLUGIN_MCP_FORMAT: harness
              PLUGIN_MCP_SERVERS: <+connectorInputs.resolveList(<+inputs.mcpConnectors>)>
              ANTHROPIC_MODEL: ${{inputs.modelName}}
              HARNESS_TOKEN: <+secrets.getValue("CristianGithub")>
  inputs:
    llmConnector:
      type: connector
      required: true
      default: account.harnessAnthropic
      ui:
        connectorCategories:
          - AI
    mcpConnectors:
      type: array
      default:
        - mcp_harness_cristian
        - mcp_github_cristian
      ui:
        component: array
        input:
          inputType: connector
          inputConfig:
            connectorTypes:
              - Mcp
    modelName:
      type: string
      default: claude-sonnet-4-6
    executionUrl:
      type: string
      required: true
  layout:
    - title: Agent Configuration
      items:
        - llmConnector
        - modelName
        - mcpConnectors
